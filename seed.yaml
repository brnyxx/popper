  - tests/test_cold_open_ui.py
- description: 세션 프로파일이 봉인 수치대로 강제된다 - product는 cap 15 + 프로브 0개(프로브 이벤트 등장 시 판정 fold가
    스트림 무효 처리), validation은 cap 15 = 판별 13 + 슬롯 9/13의 미러 프로브 2개(결정론적 선정, 컴파일 불활성,
    terminal)이며, 완전 판별 축이 5 미만이면 session_voided(reason=axis_shortfall)가 방출된다
  semantic_ac_key: ac_353cb4c5d21f7014
  verify_command: python -m pytest tests/test_session_profiles.py -q
  expected_artifacts:
  - popper/session.py
  - tests/test_session_profiles.py
- description: 세션 1 이전에 해시 봉인된 사전등록 문서가 존재하며 cap 15, N_val=2, S_scn=1(동일 시나리오 재사용
    + 기억 효과 4번째 위협 대응), 축 하한 5, 누적 판별 인스턴스 6(전체 합산 단위), 번복 상한 30%, 3범인 배제 절차, 희생 축
    규칙, 프로브 선정 규칙, 귀결 사다리, 데드라인, 한계 섹션을 모두 담고 있고, 이 판정 영향 수치들이 코드/config에는 존재하지 않는다
  semantic_ac_key: ac_a360343e0873e871
  verify_command: python -m pytest tests/test_prereg_seal.py -q
  expected_artifacts:
  - docs/prereg/prereg_sealed.json
  - tests/test_prereg_seal.py
- description: 도구 자체의 반증 판정이 append-only 이벤트에 대한 순수 fold로만 재현된다 - 저장된 판정 상태 없이 refutation_condition_met은
    기계가 방출하고 확정은 인간의 refutation_acknowledged로만 게이트되며, 카탈로그 개정은 crosswalk 동봉 시 1회만
    소진 가능하고 누적 카운터는 리셋되지 않는다
  semantic_ac_key: ac_e77ac4829b50fb64
  verify_command: python -m pytest tests/test_judgment_fold.py -q
  expected_artifacts:
