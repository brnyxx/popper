  - tests/test_judgment_fold.py
- description: 블라인드 복원 채점이 봉인 프로토콜(타 모델 계열 초안 -> 세션 전 해시 봉인 -> 세션 로그 동결 -> 개봉 + 본인
    검수)로 만든 불변 JSONL 정답지를 근거로 축별 5분류(정복원/오복원/미판별/unmappable/교정) 리포트를 내며, 교정 셀(수기값
    != 판별시험 생존값)은 core 지표 분모에서 제외되어 별도 보고되고, 정확도 분모는 매핑축만이고 커버리지와 LLM-본인 불일치율은 별도
    보고되며 out-of-catalog 문장은 원문째 JSONL 반증 로그로 보존되고 70% pass/fail 판정은 어디에도 없다
  semantic_ac_key: ac_efe2cc97d3dc89df
  verify_command: python -m pytest tests/test_scoring_report.py -q
