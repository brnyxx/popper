- description: 4막 경량 재심이 동작한다 - manifest.last_review 경과 >= 7일이면 다음 /popper 실행 시 "재심
    대기 N건" 배너가 표시되고 수동 /popper recheck로도 진입 가능하며, 미니 재심 세션(5-7긋기)이 1막 페어 UI를 재사용하고
    큐 우선순위(불안정 > untested-prior > 충돌)를 따르며 재심에서 부활한 값은 미시험으로 강등된다
  semantic_ac_key: ac_30277c02d7e1f149
  verify_command: python -m pytest tests/test_act4_recheck.py -q
  expected_artifacts:
  - popper/recheck.py
  - tests/test_act4_recheck.py
ontology_schema:
  name: PopperFalsificationSession
  description: 긋기(반증) 이벤트 스트림을 단일 진실원으로 삼아 8축 x 3값 가설 공간을 수렴시키고, 그 결과를 소유권 분리된 룰 산출물과
    봉인된 판정 아티팩트로 귀결시키는 Popper 세션의 도메인 모델
  fields:
  - name: session_id
    type: string
    description: 세션 식별자
    required: true
  - name: profile
    type: string
    description: 세션 프로파일 - product(cap 15, 프로브 0) 또는 validation(cap 15 = 판별 13 + 프로브
      2) 또는 recheck(4막 미니 재심, 5-7긋기)
    required: true
  - name: catalog_version
    type: string
    description: 축 카탈로그 버전(v1 동결, v2 개정 1회 한도). 모든 매퍼 입출력에 스탬핑
    required: true
  - name: metric_spec_version
    type: string
    description: 코어 지표 사양 버전 - catalog_version과 독립적으로 동결
    required: true
  - name: events
    type: array
    description: append-only 이벤트 스트림 - session_start, strike, undo_tombstone, revive,
      contradiction, probe_shown, probe_result, session_validated/voided, prereg_sealed,
      catalog_revision_consumed, refutation_condition_met, refutation_acknowledged
    required: true
  - name: strike
    type: object
    description: 긋기 이벤트 - strike_target(left|right|both|pair), pair_id, fragment_id,
      1:N 반증 provenance, 카운터 감소량(-0/-1/-2)
    required: true
  - name: remaining_hypotheses
    type: number
    description: 이벤트 fold로 파생되는 실제 잔존 조합 수(초기 6,561, 세션 내 단조 감소, 막 경계 revive에서만 상승)
    required: true
  - name: axes
    type: array
    description: 채굴로 역산된 8축(응답언어, 장황함, 자율성, 커밋스타일, 테스트규율, 주석문서화, 에러시행동, 범위준수) 각각의
      3값, 국소성(국소 슬롯 / 전역 스타일), mined prior 강도
    required: true
  - name: fixtures
    type: object
    description: 고정 픽스처 세트 - 공통 skeleton, 축별 대비 슬롯 3변형, 전역 축 통짜 3본, slot span 맵, 레포
      스킨 슬롯({file}/{lang}/{framework}), 저작 LLM 호출 수
    required: true
  - name: pair
    type: object
    description: 포롭터 페어 - 대비축, 배경 7축 고정값, 배경 지터 여부, 재추첨 횟수(캡 1), 판별력-없음 마킹
    required: true
  - name: probe_records
    type: array
    description: 미러 중복쌍 프로브 - 원본 쌍 id, mirrored 플래그, 결과(flip|consistent), 슬롯 위치(9/13),
      컴파일 불활성 + terminal
    required: true
  - name: rules
    type: array
    description: 컴파일된 룰 - rule_id, axis, value, 룰 문장, 반증 provenance(strike event 참조),
      재심 생존 전적
    required: true
  - name: corroboration_grade
    type: string
    description: 룰 등급 - 판별시험 통과 / 무차별 생존(비-corroborating) / 완전 미시험 / 불안정(프로브 플립 관측)
    required: true
  - name: value_source
    type: string
    description: 등급과 직교하는 값 출처 - elicited(긋기 유래) 또는 mined-prior(커뮤니티 최빈값 채굴)
    required: true
  - name: manifest
    type: object
    description: 사이드카 manifest.json - 룰별 인식론 메타데이터, 마지막 쓰기 content hash, last_review
      타임스탬프, 예약된 scope 필드, 사전등록 문서 참조, 재심 표적 큐
    required: true
  - name: outputs
    type: object
    description: 산출물 - ~/.claude/popper/POPPER.md(실행 룰만), settings.popper.json(제안),
      추천 훅 목록, 충돌 리포트 섹션, 사용자 CLAUDE.md의 @import 한 줄
    required: true
  - name: conflict_queue
    type: array
    description: 기존 수기 룰과 신규 룰의 축 단위 극성/값 충돌 항목 - 자동 해소 없이 재심 큐 적재, 수기 룰 등록은 opt-in
    required: true
  - name: recheck_queue
    type: array
    description: 4막 재심 표적 큐 - 우선순위 고정(불안정 > untested-prior > 충돌), manifest.last_review
      경과 >= 7일 배너 또는 /popper recheck로 소비
    required: true
  - name: prereg_seal
    type: object
    description: 봉인 사전등록 문서 - 동결 수치(cap 15/N_val 2/S_scn 1/floor 5/인스턴스 6 전체합산), 3범인
      배제 절차 + 기억 효과 4번째 위협, 번복 상한 30%, 귀결 사다리, crosswalk 요건, 해시
    required: true
  - name: ground_truth
    type: array
    description: 봉인 프로토콜로 확정된 불변 정답지 JSONL - 룰 문장 -> 축x값 매핑, catalog_version 스탬프,
      LLM-본인 불일치 기록
    required: true
  - name: scoring_report
    type: object
    description: 축별 5분류(정복원/오복원/미판별/unmappable/교정) 정성 리포트 - 교정 셀은 core 분모 제외 별도 보고,
      매핑축 분모 정확도, 별도 커버리지, out-of-catalog JSONL 반증 로그
    required: true
  - name: judgment_state
    type: object
    description: 이벤트 fold로만 파생되는 판정 - 진행중/개정소진/조건성립/핵심반증확정, 누적 세션 수와 판별 인스턴스 수(전체
      합산)
    required: true
evaluation_principles:
- name: 반증가능성 원칙
  description: 추상 질문이 아니라 기각 가능한 구체 장면만 제시한다 - 모든 사용자 접점이 반증 시도로 환원되는가
  weight: 1.0
- name: 검증주의 금지
  description: 긍정 입력을 완전히 제거하고 생존을 승인으로 기록하지 않는다 - 확인 버튼, 예/아니오, 암묵적 승인 경로가 없는가
  weight: 0.95
- name: 이벤트 결정성과 감사가능성
  description: append-only 스트림에 대한 순수 fold로 카운터/등급/판정이 재현되고 파생 상태를 저장하지 않는가
  weight: 0.9
- name: 사용자 파일 소유권 안전
  description: Popper 소유 파일 밖을 절대 쓰지 않고, 수기 산문 무파괴와 허가 기반 활성화, 수기 편집 감지가 지켜지는가
  weight: 0.9
- name: 인식론적 정직
  description: 미시험 추측을 corroborated처럼 무표기로 내보내지 않고 등급과 provenance를 항상 동반하는가
  weight: 0.85
- name: 사전등록 무결성
  description: 판정 영향 수치와 3범인 배제 절차가 데이터 관찰 전에 봉인되어 사후 탈출구(재분류/지표 재정의/개정 반복)가 막혀 있는가
  weight: 0.85
- name: 귀속의 스키마화
  description: strike -> fragment_id -> axis 귀속이 사람 규율이 아니라 슬롯 span 스키마로 보장되는가
  weight: 0.75
- name: 콜드 오픈 손맛
  description: 질문 0개, 10초 첫 장면, 긋기 드래그 중심의 짧은 세션 계약이 검증 요구로 훼손되지 않는가
  weight: 0.7
- name: 비용 상한 준수
  description: 런타임 LLM 호출 0회, 시나리오당 저작 호출 20회 이하, 신규 컴포넌트 대신 공용 매퍼/봉인 기계 재사용
  weight: 0.6
- name: MVP 절제
  description: 2막 리플레이 채점/초점 몽타주/대화 관찰 수집과 다축 조합 렌더를 구현하지 않고 스키마 예약으로만 남기는가(4막 경량
    재심은 MVP 포함)
  weight: 0.6
exit_conditions:
- name: MVP 수용 완료
  description: 1막 포롭터, 가설 카운터, 실시간 컴파일 페인, 컴파일러, 4막 경량 재심, 산출물 착지와 봉인 검증 체계가 모두 통과
  criteria: 전체 ACCEPTANCE_CRITERIA 통과 + 일반 세션 1회가 cap 15로 완주해 POPPER.md/manifest.json/settings.popper.json이
    ~/.claude/popper/에 착지 + /popper recheck 진입 경로 동작
- name: 검증 세션 판정 도달
  description: catalog v1 동결 상태에서 유효 세션이 누적되어 코어 지표 판정이 가능한 표본에 도달
  criteria: VOID 아닌 검증 세션 >= 2 + 판별시험-통과 인스턴스 누적 >= 6(전체 합산), floor 미달 시 3세션째까지 연장
    후 종료
- name: 핵심 반증 확정
  description: 무변명 코어히트 누적으로 긋기-only 접근이 반증되어 직접편집 전환으로 피벗
  criteria: fold가 refutation_condition_met 방출(오복원 >= 정복원) + 인간의 refutation_acknowledged
    기록, 또는 오복원율 > 33%
- name: 귀결 사다리 강등 실행
  description: 오복원율이 중간대에 들어 strike-only에서 strike+confirmation으로 강등
  criteria: 오복원율 10-33% 구간 확정 시 축별 복원안 원탭 확인 채널 추가 결정 기록
- name: 개정 소진 후 재충족
  description: 카탈로그 v2 개정 1회를 소진한 뒤 동일 기준이 다시 충족되면 추가 개정 없이 확정 반증
  criteria: catalog_revision_consumed 이벤트 존재 + v2에서 코어 반증 조건 재성립
- name: 검증 무효 반복
  description: 라벨 번복율 초과나 축 미달로 세션이 계속 무효화되어 채점 자체가 성립하지 않음
  criteria: 번복율 30% 초과 또는 완전 판별 축 < 5로 session_voided가 반복되어 사전등록 데드라인 도달
