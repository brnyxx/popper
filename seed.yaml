# Popper MVP Seed (seed_a91eb8ae891f 기반 + 사용자 확정 정정 3건 수기 반영)
# 정정 내역 (2026-08-28, 인터뷰 interview_20260827_053750의 Seed-ready challenge 답변):
#   1. 4막 경량 재심을 MVP에 포함 (생성기가 v2로 기록한 것을 사용자 선택대로 복원)
#   2. 검증 리포트 분류를 4분류 -> 5분류로 ('교정' 셀 신설, core 지표 분모 제외)
#   3. S 기호 분리: S_scn(시나리오 수)=1 / N_val(검증 세션 수)=2 + 기억 효과 4번째 위협 등재
goal: Popper MVP 구축 - 질문 대신 반증 가능한 추측(같은 장면의 대비 페어 트랜스크립트)을 제시하고 사용자의 유일한 동사인 "긋기"만으로
  Claude Code 설정을 수렴시키는 Claude Code 플러그인(/popper 스킬 + 로컬 웹 UI)을, 1막 포롭터 + 가설 공간 카운터
  + 실시간 컴파일 페인 + 컴파일러 + 4막 경량 재심(경과 배너 + /popper recheck) 범위로 만들고, 그 핵심 추측("긋기만으로 설정이
  수렴한다") 자체를 봉인 사전등록 + 축별 5분류 채점으로 반증 가능하게 유지한다
task_type: code
brownfield_context:
  project_type: greenfield
  context_references: []
  existing_patterns: []
  existing_dependencies: []
constraints:
- 형태는 독립 CLI가 아니라 Claude Code 플러그인 - /popper 스킬 + 로컬 웹 UI 한 장(TUI 불채택, 빨간펜 드래그 손맛
  필요)
- 세션 런타임에 LLM 호출 0회, 에이전트 실행 0회, 인터뷰 질문 0회 - LLM은 픽스처 저작 시점에만 사용
- 긍정 입력 완전 제거 - 사용자의 유일한 동사는 긋기, 확인/승인/예-아니오 컨트롤 없음
- strike_target enum은 {left, right, both, pair} 4값이며 별도 긍정 입력이나 조용한 스킵을 두지 않는다
- 생존은 어떤 경우에도 승인으로 기록하지 않는다 - strike-only 이벤트 스키마, 생존은 '아직 반증 안 됨' 상태
- 긋기 이벤트는 1:N 반증 provenance 지원(both = 한 이벤트에 반증 2건), 카운터 감소는 가변(-0/-1/-2)
- pair-strike(무차별) 재추첨 캡은 1회, 해당 페어는 축x장면 판별력-없음 이벤트로 기록
- 세션 내 긋기는 하드 반증 - 카운터는 항상 실제 잔존 조합 수인 정수이며 단조 감소, 확률/베이지안 선호 모델 불채택
- 오긋기 복구는 확률 모델이 아니라 명시 이벤트 채널만 - undo tombstone, 막 경계의 revive, 축 3값 전멸 시 모순 이벤트로
  동일 축 재시험 강제
- 모든 이벤트는 append-only이며 카운터/판정 상태는 저장하지 않고 순수 fold 파생값(replay 결정적)
- CLAUDE.md 계열 산출물에는 실행 가능한 룰만 싣는다 - 인식론적 메타데이터는 기계가독 사이드카 manifest에 분리
- 반증 이력 0건 축도 채굴된 커뮤니티 최빈값을 '반증 대기 추측(n=0)'으로 실제 실행 룰로 방출한다(생략/미결 주석 불채택)
- corroboration 3등급(판별시험 통과 / 무차별 생존 / 완전 미시험) + 플립 관측 시 '불안정' 등급, value_source(elicited
  / mined-prior)는 직교 필드
- 산출 경로는 ~/.claude/popper/ 단독 소유 - POPPER.md + manifest.json + settings.popper.json(제안
  파일)
- 사용자 파일 직접 편집 절대 금지 - CLAUDE.md 본문과 라이브 settings.json에 쓰지 않으며, @import 한 줄 추가도 매번
  허가 후
- 기존 수기 룰과 신규 룰의 충돌은 write-time 자동 해소 금지 - 충돌 리포트 기록 + 재심 큐 적재만
- strike 이벤트 근거 없는 룰 변경 금지, 수기 룰의 반증 대상 등록은 opt-in만(default-in 금지)
- manifest에 마지막 쓰기 content hash 저장 - hash 불일치는 최강 strike 신호로 기록하고 silent overwrite
  금지
- MVP는 global 스코프만, manifest에 scope 필드만 예약(per-repo 2-tier는 미구현)
- 픽스처는 하이브리드 - 공통 skeleton(채굴 최빈값 내장) + 축별 대비 슬롯 3변형, 전역 스타일 축만 통짜 3본 예외
- 픽스처 저작 전 8축의 국소성 판정표(국소=슬롯화 / 전역=통짜)를 먼저 작성한다
- render-then-freeze - 조립 렌더 산출물은 사람 손질 후 고정본으로 승격, 순수 런타임 조립 배제
- 픽스처 저작 상한 - 시나리오당 LLM 호출 약 10회, 재생성 버퍼 포함 20회, MVP는 S_scn=1(픽스처 시나리오 세트 수)
- slot span 맵을 strike->fragment_id->axis 귀속 스키마이자 2막 어긋남 메타데이터의 공용 키로 설계(2막은 스키마만
  예약)
- 레포는 읽기전용 스캔으로 {file}/{lang}/{framework} 슬롯만 치환
- 일반(제품) 세션 cap = 정확히 15 스트라이크, 프로브 0개 - 12-15 범위 표기 폐기(optional stopping 차단)
- 검증 세션 N_val = 정확히 2, cap = 정확히 15(판별 13 + 미러 프로브 2, 슬롯 9번/13번 고정) - S_scn(시나리오
  수)과 N_val(검증 세션 수)은 별개 기호이며 사전등록 문서에도 분리 명기
- 검증 2세션은 동일 시나리오(S_scn=1) 재사용이며 기억 효과를 4번째 위협으로 사전등록에 등재 - 페어 제시 순서/좌우 재무작위화 + 세션
  간 >=48시간 간격 + 능동학습기 경로 다변화로 대응
- '프로브 쌍 선정은 이벤트 prefix의 순수 함수인 결정론적 규칙으로 봉인(예: 전반부 첫 판별쌍의 미러)'
- 프로브는 별도 이벤트(probe_shown / probe_result{flip|consistent}), 컴파일 fold에 불활성이며 재추첨 불가(terminal)
- session_start에 profile 필드(product|validation) - product 스트림에 프로브 이벤트가 나타나면 판정 fold가
  해당 스트림 무효 처리
- 세션 유효성 하한 - 완전 판별 통과 축 >= 5, 미달 시 session_voided(reason=axis_shortfall) 방출 + 판정
  세션 불산입, 자동 연장 없음
- 검증 세션에서 프로브 비용을 지불해 미시험으로 남길 축은 mined prior가 가장 강한 2축으로 사전 고정(런타임/개발자 재량 금지)
- 70% 단일 pass/fail 임계값 폐기 - 채점은 축별 5분류(정복원/오복원/미판별/unmappable/교정) 정성 리포트. '교정' 셀은
  수기값 != 판별시험 생존값인 충돌 축으로, core 반증 지표 분모에서 제외하고 별도 리포트(제품의 교정 기능이 자기반증 지표의 벌점이 되는
  자기모순 차단)
- 정확도 분모 = 매핑된 축만, 커버리지(매핑축/8)는 별도 지표로 보고, out-of-catalog 문장은 채점 제외하되 JSONL 반증 로그로
  원문째 수집
- 정답지 라벨링은 픽스처 저작과 다른 모델 계열 LLM 초안 -> 세션 전 해시 봉인 -> 세션 로그 해시 동결 -> 개봉 + 본인 검수, LLM-본인
  불일치율도 지표로 기록
- 룰 문장->축x값 매퍼는 축 채굴(발견 모드)과 정답지 라벨링(분류 모드)이 공유하는 재사용 모듈이며 입출력에 catalog_version 스탬핑
- 판정 영향 수치(cap, N_val, floor, 누적 하한 단위, 번복 상한 30%, 희생 규칙, 프로브 선정 규칙, 귀결 사다리)는 코드/config가
  아니라 봉인된 사전등록 문서 안에만 둔다
- 사전등록 문서는 세션 1 이전에 작성 + 라벨 봉인과 동일한 해싱 기계로 봉인하고 manifest에서 참조되는 최상위 불변 아티팩트로 둔다
- 코어 반증 지표의 기소 대상은 판별시험-통과 축의 오복원만 - unmappable은 카탈로그 belt, 무차별 생존/미시험은 픽스처·능동학습기
  belt로 구획, 교정 셀은 분모 제외
- 단일 세션 판정 금지 - catalog v1 동결 상태에서 누적 2세션 이상 + 판별시험-통과 인스턴스 6개 이상(전체 합산 단위), 오복원 >=
  정복원이면 core 반증 조건 성립, floor 미달 시 3세션째로 연장
- 3범인 배제 절차 사전 봉인 - 픽스처 탓은 제3모델 조작점검 미통과 쌍에만, 변덕 탓은 플립 관측 축에만, 라벨 탓은 봉인라벨 번복 채널로만,
  번복율 30% 초과 시 세션 VOID
- 카탈로그 개정은 v1->v2 정확히 1회만, v1->v2 축 crosswalk 동봉 필수, 누적 카운터는 crosswalk로 승계(리셋 금지),
  v2에서 동일 기준 재충족 시 확정 반증
- refutation_condition_met은 fold가 기계 방출하되 핵심반증 확정은 인간의 refutation_acknowledged 이벤트로
  게이트
- MVP 범위는 1막 포롭터 + 가설 카운터 + 실시간 컴파일 페인 + 컴파일러 + 봉인 검증 체계 + 4막 경량 재심 - 2막 리플레이 채점,
  초점 몽타주, 대화 관찰 기반 런타임 교정 수집은 v2(스키마만 예약)
- 4막 경량 재심 사양 - 데몬/훅 없음. 다음 /popper 실행 시 manifest.last_review 경과(>=7일) 체크로 "재심 대기
  N건" 배너 표시, 수락 시 5-7긋기 미니 재심 세션(1막 페어 UI 재사용, 신규 기계장치 0), 수동 /popper recheck 명령
  병행. 큐 우선순위 고정 - 불안정 > untested-prior > 충돌. 부활값은 미시험 강등. 런타임 교정 수집은 MVP에서 content
  hash 수기편집 감지까지만
- 축 카탈로그는 발명이 아니라 채굴 - GitHub 공개 CLAUDE.md/AGENTS.md 100-200개 클러스터링으로 8축 x 3값(가설 6,561개)
  역산
- 콜드 오픈 계약 - 질문 0개, 10초 안에 첫 장면, 일반 세션 UX는 검증을 위해 훼손하지 않는다
- 첫 페어는 자율성 축(기본값이 틀렸을 때 가장 비싼 축)
