name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install ".[release]"
      - run: npm install --global @anthropic-ai/claude-code
      - name: Validate tag and plugin manifests
        run: |
          VERSION="$(python -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          claude plugin validate .
      - run: python -m build
      - run: python -m twine check dist/*.whl dist/*.tar.gz
      - run: python scripts/build_plugin_archive.py "dist/popper-plugin-${VERSION}.zip"
      - name: Create checksums
        working-directory: dist
        run: sha256sum ./*.whl ./*.tar.gz ./*.zip > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
